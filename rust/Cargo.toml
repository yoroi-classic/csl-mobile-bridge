[package]
name = "cml-mobile-bridge"
version = "5.1.2"
authors = ["yoroi-classic contributors"]
edition = "2018"

[build-dependencies]
cbindgen = "=0.26.0"

[dependencies]
cml-chain = "=6.2.0"
cml-crypto = "=6.2.0"
cbor_event = "=2.4.0"
hex = "=0.4.2"
serde_json = "1.0"
sha2 = "=0.9.1"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.4.3"
base64 = "0.20.0"
# tag = "2.3.1"

[target.'cfg(target_os="android")'.dependencies]
jni = "0.20.0"

[lib]
name = "react_native_haskell_shelley"
crate-type = ["staticlib", "cdylib"]

[profile.release]
debug = false
opt-level = 's'
lto = false
